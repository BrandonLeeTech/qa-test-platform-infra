# Conservative local-learning values for the official docker-selenium chart.
# Pin the chart version in the install command once a tested version is chosen.

isolateComponents: true

ingress:
  enabled: false

components:
  router:
    serviceType: ClusterIP

# Local-only convenience: allow noVNC Live View without a password.
# Do not use this setting when noVNC is exposed beyond the local machine.
chromeNode:
  extraEnvironmentVariables:
    - name: SE_VNC_NO_PASSWORD
      value: "true"

firefoxNode:
  extraEnvironmentVariables:
    - name: SE_VNC_NO_PASSWORD
      value: "true"

edgeNode:
  extraEnvironmentVariables:
    - name: SE_VNC_NO_PASSWORD
      value: "true"

autoscaling:
  enabled: false

basicAuth:
  enabled: false
